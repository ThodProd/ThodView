name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal

      - name: Cache bundled tools
        uses: actions/cache@v4
        with:
          path: .cache
          key: thodview-tools-ffmpeg-9.0.2-exiftool-13.59

      - name: Verify
        run: cargo +stable-x86_64-pc-windows-msvc test --locked

      - name: Build package
        run: |
          $env:RUSTUP_TOOLCHAIN = 'stable-x86_64-pc-windows-msvc'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            .\scripts\build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
          } else {
            .\scripts\build.ps1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ThodView-Windows-x64
          path: |
            artifacts/thodview-*-win-x64.zip
            artifacts/hub/
          if-no-files-found: error

      - name: Publish ThodHUB release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $tag = "hub-v$version"
          gh release create $tag "artifacts/hub/thodview-$version-win-x64.zip" "artifacts/hub/thodhub-release.json" --target $env:GITHUB_SHA --latest=false --title "ThodView $version для ThodHUB" --notes "Версия на Rust для установки и обновления через ThodHUB."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          gh release create $env:GITHUB_REF_NAME "artifacts/thodview-$version-win-x64.zip" --verify-tag --generate-notes --title "ThodView $version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
